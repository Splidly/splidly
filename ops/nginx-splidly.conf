limit_req_zone $binary_remote_addr zone=splidly_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=splidly_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=splidly_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name splidly.site;

    # Application logs provide request observability with invite credentials
    # redacted. Do not duplicate raw invite URLs in Nginx access logs.
    access_log off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name splidly.site;

    # Invite links contain bearer credentials. The application emits sanitized
    # structured request logs, so raw reverse-proxy access logging stays off.
    access_log off;

    # Keep the certificate directives managed by the host's existing TLS setup.
    ssl_certificate /etc/letsencrypt/live/splidly.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/splidly.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SplidlyTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn splidly_connections 20;

    location ^~ /api/auth/ {
        limit_req zone=splidly_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        limit_req zone=splidly_api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
