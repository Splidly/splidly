# Security backports retain Expo's supported transitive major versions.
# glob: GHSA-3g3m-2fjr-6pw4, upstream 4682e8c9babee1b385202ede36389634e12076d7.
# minimatch: GHSA-g3hv-75wg-m249, upstream 77a0f5c4b80bdc641c3c930a1d9edf5ad2db57f8.
# deepmerge: GHSA-gcqx-w48m-w2h4, define own keys without invoking prototype setters.
# The registry audit still reports the original versions; security:check verifies the installed fixes.
patchedDependencies:
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
  glob@10.5.0: patches/glob@10.5.0.patch
  glob@13.0.6: patches/glob@13.0.6.patch
  minimatch@9.0.9: patches/minimatch@9.0.9.patch
  minimatch@10.2.6: patches/minimatch@10.2.6.patch
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
